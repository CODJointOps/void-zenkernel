name: Update zen kernel

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITEA_TOKEN }}

      - name: Install toolchain
        run: |
          set -eu
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            flex bison bc libelf-dev libssl-dev clang lld llvm dwarves shellcheck
          sudo curl -fsSL -o /usr/local/bin/xlint https://raw.githubusercontent.com/leahneukirchen/xtools/master/xlint
          sudo chmod +x /usr/local/bin/xlint

      - name: Lint scripts
        run: shellcheck scripts/*.sh

      - name: Update
        run: |
          set -eu
          git config user.name "Wizzard"
          git config user.email "rich@bandaholics.cash"
          scripts/update.sh -c

      - name: Push
        run: |
          set -eu
          branch="${GITHUB_REF_NAME:-${GITEA_REF_NAME:-main}}"
          [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$branch")" ] || { echo "nothing to push"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase origin "$branch" && git push origin "HEAD:$branch" && exit 0
            echo "push attempt $i failed, retrying"; sleep 10
          done
          exit 1
